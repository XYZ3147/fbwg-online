<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fireboy &amp; Watergirl Online</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <header class="bar">
    <div class="brand"><span class="fire">Fireboy</span> <span class="amp">&amp;</span> <span class="water">Watergirl</span> <span class="tag">Online</span></div>
    <div class="info" id="info" hidden>
      <span class="chip" id="roleChip"></span>
      <span class="hint" id="hint"></span>
      <span class="stats" id="stats"></span>
    </div>
    <div class="actions" id="actions" hidden>
      <button type="button" id="soundBtn" title="Sound (M)">Sound on</button>
      <button type="button" id="qualityBtn" title="Picture quality">Smooth</button>
      <button type="button" id="fitBtn" title="Picture size">Fit</button>
      <button type="button" id="controlsBtn" title="Keys and controller">Controls</button>
      <button type="button" id="fullBtn" title="Fullscreen (F)">Fullscreen</button>
      <button type="button" id="leaveBtn" class="ghost">Leave</button>
    </div>
  </header>

  <main id="stage">
    <section class="card" id="joinCard">
      <h1>Join a friend's game</h1>
      <p>Ask the host for the room code shown in their extension popup.</p>
      <form id="joinForm" autocomplete="off">
        <input id="codeInput" maxlength="8" placeholder="ROOM CODE" spellcheck="false" aria-label="Room code">
        <button type="submit" id="joinBtn">Join</button>
      </form>
      <p class="msg" id="joinMsg" role="status"></p>
      <p class="credit">Made by XYZ</p>
    </section>

    <div class="screen" id="screen" hidden>
      <video id="video" autoplay playsinline></video>
      <div class="signal-layer" id="signalLayer"></div>
      <div class="overlay" id="overlay" role="status"></div>
      <button type="button" class="unmute" id="unmuteBtn" hidden>Click to turn on sound</button>
    </div>
  </main>

  <script src="lib/peerjs.min.js"></script>
  <script src="shared.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
